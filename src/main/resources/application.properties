# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# --- Database (CockroachDB over the PostgreSQL wire protocol) ---
# Supplied via environment variables so no credentials live in the repo. See .env.example.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=1

# Creates/updates tables on startup. Fine for the first iterations; switch to Flyway migrations
# before the schema stabilises or the data matters.
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# --- App ---
# Time zone used for "today" when generating assignments and picking the current month.
roomchores.zone=Asia/Kolkata

quarkus.log.category."com.roomchores".level=INFO
